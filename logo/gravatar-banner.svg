<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 288" width="1280" height="288" role="img" aria-label="Simple PHP IPAM — decorative network topology">
  <!-- Gravatar profile header (1280x288). Pure decoration — text lives in the    -->
  <!-- display name + bio, not the banner. Three node clusters span the canvas    -->
  <!-- so the composition reads as balanced regardless of how mobile crops or     -->
  <!-- where the avatar lands.                                                    -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#0A1220"/>
    </linearGradient>

    <radialGradient id="glowL" cx="0.18" cy="0.50" r="0.42">
      <stop offset="0%"  stop-color="#0EA5E9" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowC" cx="0.50" cy="0.50" r="0.40">
      <stop offset="0%"  stop-color="#22C55E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowR" cx="0.85" cy="0.50" r="0.42">
      <stop offset="0%"  stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>

    <!-- Soft glow filter for the hub nodes -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="1280" height="288" fill="url(#bg)"/>
  <rect width="1280" height="288" fill="url(#grid)" opacity="0.55"/>
  <rect width="1280" height="288" fill="url(#glowL)"/>
  <rect width="1280" height="288" fill="url(#glowC)"/>
  <rect width="1280" height="288" fill="url(#glowR)"/>

  <!-- Long backbone connections — the "trunks" between clusters. Very faint.    -->
  <g stroke="#22C55E" stroke-opacity="0.12" stroke-width="1.2" stroke-linecap="round" fill="none">
    <line x1="220"  y1="140" x2="640"  y2="120"/>
    <line x1="640"  y1="120" x2="1060" y2="150"/>
    <line x1="170"  y1="200" x2="640"  y2="180"/>
    <line x1="640"  y1="180" x2="1100" y2="210"/>
  </g>

  <!-- LEFT cluster (~x=40..480) — under avatar on desktop, mostly under on mobile -->
  <g stroke="#22C55E" stroke-opacity="0.32" stroke-width="1.4" stroke-linecap="round" fill="none">
    <line x1="60"  y1="70"  x2="180" y2="120"/>
    <line x1="180" y1="120" x2="100" y2="210"/>
    <line x1="180" y1="120" x2="300" y2="80"/>
    <line x1="300" y1="80"  x2="220" y2="190"/>
    <line x1="300" y1="80"  x2="420" y2="140"/>
    <line x1="420" y1="140" x2="360" y2="240"/>
    <line x1="420" y1="140" x2="480" y2="60"/>
    <line x1="220" y1="190" x2="100" y2="210"/>
  </g>
  <g fill="#22C55E" fill-opacity="0.50">
    <circle cx="60"  cy="70"  r="3"/>
    <circle cx="180" cy="120" r="5" filter="url(#nodeGlow)"/>
    <circle cx="100" cy="210" r="3"/>
    <circle cx="300" cy="80"  r="3"/>
    <circle cx="220" cy="190" r="3"/>
    <circle cx="420" cy="140" r="5" filter="url(#nodeGlow)"/>
    <circle cx="360" cy="240" r="3"/>
    <circle cx="480" cy="60"  r="2.5"/>
  </g>

  <!-- CENTER cluster (~x=520..820) -->
  <g stroke="#22C55E" stroke-opacity="0.28" stroke-width="1.3" stroke-linecap="round" fill="none">
    <line x1="540" y1="100" x2="640" y2="160"/>
    <line x1="640" y1="160" x2="560" y2="230"/>
    <line x1="640" y1="160" x2="760" y2="100"/>
    <line x1="640" y1="160" x2="780" y2="220"/>
    <line x1="760" y1="100" x2="820" y2="180"/>
  </g>
  <g fill="#22C55E" fill-opacity="0.50">
    <circle cx="540" cy="100" r="3"/>
    <circle cx="640" cy="160" r="6" filter="url(#nodeGlow)"/>
    <circle cx="560" cy="230" r="3"/>
    <circle cx="760" cy="100" r="3.5"/>
    <circle cx="780" cy="220" r="3"/>
    <circle cx="820" cy="180" r="3"/>
  </g>

  <!-- RIGHT cluster (~x=880..1240) -->
  <g stroke="#22C55E" stroke-opacity="0.32" stroke-width="1.4" stroke-linecap="round" fill="none">
    <line x1="900"  y1="80"  x2="1000" y2="140"/>
    <line x1="1000" y1="140" x2="920"  y2="210"/>
    <line x1="1000" y1="140" x2="1100" y2="90"/>
    <line x1="1100" y1="90"  x2="1180" y2="160"/>
    <line x1="1180" y1="160" x2="1080" y2="230"/>
    <line x1="1100" y1="90"  x2="1240" y2="60"/>
    <line x1="920"  y1="210" x2="1080" y2="230"/>
  </g>
  <g fill="#22C55E" fill-opacity="0.50">
    <circle cx="900"  cy="80"  r="3"/>
    <circle cx="1000" cy="140" r="5" filter="url(#nodeGlow)"/>
    <circle cx="920"  cy="210" r="3"/>
    <circle cx="1100" cy="90"  r="3.5"/>
    <circle cx="1180" cy="160" r="5" filter="url(#nodeGlow)"/>
    <circle cx="1080" cy="230" r="3"/>
    <circle cx="1240" cy="60"  r="2.5"/>
  </g>

  <!-- Top CIDR ticker, full-width, very faint -->
  <g font-family="'Fira Code','JetBrains Mono','Menlo','Monaco','Consolas',monospace"
     font-size="12" fill="#22C55E" fill-opacity="0.20">
    <text x="40"   y="26">10.0.0.0/8</text>
    <text x="180"  y="26">172.16.0.0/12</text>
    <text x="350"  y="26">192.168.0.0/16</text>
    <text x="540"  y="26">100.64.0.0/10</text>
    <text x="700"  y="26">2001:db8::/32</text>
    <text x="850"  y="26">fe80::/10</text>
    <text x="970"  y="26">::1/128</text>
    <text x="1080" y="26">198.18.0.0/15</text>
  </g>

  <!-- Bottom CIDR ticker, even fainter -->
  <g font-family="'Fira Code','JetBrains Mono','Menlo','Monaco','Consolas',monospace"
     font-size="12" fill="#22C55E" fill-opacity="0.14">
    <text x="60"   y="270">169.254.0.0/16</text>
    <text x="220"  y="270">203.0.113.0/24</text>
    <text x="400"  y="270">::/0</text>
    <text x="500"  y="270">2002::/16</text>
    <text x="640"  y="270">2620:0:0::/48</text>
    <text x="820"  y="270">fc00::/7</text>
    <text x="940"  y="270">192.0.2.0/24</text>
    <text x="1100" y="270">240.0.0.0/4</text>
  </g>
</svg>
