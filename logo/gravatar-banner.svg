<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 288" width="1280" height="288" role="img" aria-label="Simple PHP IPAM — self-hosted IP address management">
  <!-- Gravatar profile header (1280x288). Avatar overlaps the left ~40%, so all -->
  <!-- copy is anchored in the right ~60%; decorative network art lives on the left. -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#0A1220"/>
    </linearGradient>

    <radialGradient id="glowR" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0%"  stop-color="#22C55E" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#22C55E" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowL" cx="0.20" cy="0.55" r="0.45">
      <stop offset="0%"  stop-color="#0EA5E9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="288" fill="url(#bg)"/>
  <rect width="1280" height="288" fill="url(#grid)" opacity="0.55"/>
  <rect width="1280" height="288" fill="url(#glowL)"/>
  <rect width="1280" height="288" fill="url(#glowR)"/>

  <!-- Decorative network topology, weighted left (avatar will sit on top) -->
  <g stroke="#22C55E" stroke-opacity="0.30" stroke-width="1.4" stroke-linecap="round" fill="none">
    <line x1="40"  y1="60"  x2="160" y2="120"/>
    <line x1="160" y1="120" x2="100" y2="220"/>
    <line x1="160" y1="120" x2="280" y2="80"/>
    <line x1="280" y1="80"  x2="380" y2="160"/>
    <line x1="380" y1="160" x2="260" y2="240"/>
    <line x1="380" y1="160" x2="460" y2="100"/>
    <line x1="460" y1="100" x2="430" y2="220"/>
  </g>
  <g fill="#22C55E" fill-opacity="0.45">
    <circle cx="40"  cy="60"  r="3"/>
    <circle cx="160" cy="120" r="4.5"/>
    <circle cx="100" cy="220" r="3"/>
    <circle cx="280" cy="80"  r="3"/>
    <circle cx="380" cy="160" r="4.5"/>
    <circle cx="260" cy="240" r="3"/>
    <circle cx="460" cy="100" r="3"/>
    <circle cx="430" cy="220" r="3"/>
  </g>

  <!-- Faint right-side network flecks for visual balance -->
  <g stroke="#22C55E" stroke-opacity="0.14" stroke-width="1" stroke-linecap="round" fill="none">
    <line x1="1100" y1="50"  x2="1200" y2="120"/>
    <line x1="1200" y1="120" x2="1140" y2="220"/>
  </g>
  <g fill="#22C55E" fill-opacity="0.22">
    <circle cx="1100" cy="50"  r="2.5"/>
    <circle cx="1200" cy="120" r="3"/>
    <circle cx="1140" cy="220" r="2.5"/>
  </g>

  <!-- Top CIDR ticker, full-width but very faint -->
  <g font-family="'Fira Code','JetBrains Mono','Menlo','Monaco','Consolas',monospace"
     font-size="12" fill="#22C55E" fill-opacity="0.18">
    <text x="40"   y="26">10.0.0.0/8</text>
    <text x="180"  y="26">172.16.0.0/12</text>
    <text x="350"  y="26">192.168.0.0/16</text>
    <text x="540"  y="26">100.64.0.0/10</text>
    <text x="700"  y="26">2001:db8::/32</text>
    <text x="850"  y="26">fe80::/10</text>
    <text x="970"  y="26">::1/128</text>
    <text x="1080" y="26">198.18.0.0/15</text>
  </g>

  <!-- Hero copy, narrow column centered at x=720 to survive both the desktop -->
  <!-- avatar overlay (covers up to ~x=520) AND the mobile right-edge crop      -->
  <!-- (visible window ends ~x=900). Effective safe column: x=520..x=900.       -->
  <g text-anchor="middle">
    <!-- Qualifier -->
    <text x="720" y="92"
          font-family="'Inter','SF Pro Display','Helvetica Neue','Arial',sans-serif"
          font-size="22" font-weight="500" fill="#94A3B8" letter-spacing="2.4">
      SELF-HOSTED
    </text>

    <!-- Hero word -->
    <text x="720" y="172"
          font-family="'Inter','SF Pro Display','Helvetica Neue','Arial',sans-serif"
          font-size="78" font-weight="800" fill="#F8FAFC" letter-spacing="-2">
      IPAM<tspan fill="#22C55E">.</tspan>
    </text>

    <!-- Stack line -->
    <text x="720" y="208"
          font-family="'Fira Code','JetBrains Mono','Menlo','Monaco','Consolas',monospace"
          font-size="14" font-weight="400" fill="#94A3B8" letter-spacing="0.3">
      PHP 8.2+ · SQLite · MySQL · PostgreSQL
    </text>

    <!-- URL chip -->
    <g transform="translate(598, 224)">
      <rect x="0" y="0" width="244" height="32" rx="8"
            fill="#22C55E" fill-opacity="0.10"
            stroke="#22C55E" stroke-opacity="0.45" stroke-width="1"/>
      <text x="122" y="22"
            font-family="'Fira Code','JetBrains Mono','Menlo','Monaco','Consolas',monospace"
            font-size="15" font-weight="500" fill="#22C55E">
        simplephpipam.com
      </text>
    </g>
  </g>

</svg>
