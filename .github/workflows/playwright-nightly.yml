name: Playwright (nightly)

# Nightly containerized Playwright harness for Simple PHP IPAM.
#
# - `containerized-playwright` runs the full suite against a Dockerized Apache+PHP
#   instance seeded from demo_seed.php. SQLite is the only driver in v2.5.2;
#   v2.10.0 adds mysql and v2.11.0 adds pgsql to the matrix.
# - `htaccess-subset` runs a small HTTP-level test that verifies .htaccess deny
#   rules work correctly against the same image.
# - `api-tests` runs testing/scripts/test_api.sh against the same image (#451,
#   v2.9.0). API regression coverage that previously only ran against the
#   shared dev-direct host now runs in CI on every PR.
#
# All three jobs use testing/playwright/Dockerfile.apache so the realism gap
# between `php -S` and production Apache does not exist.

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - 'Simple-PHP-IPAM/**'
      - 'testing/playwright/**'
      - 'testing/scripts/**'
      - '.github/workflows/playwright-nightly.yml'

concurrency:
  group: playwright-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containerized-playwright:
    name: Playwright (${{ matrix.driver }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        driver: [sqlite]   # v2.10.0 adds 'mysql'; v2.11.0 adds 'pgsql'
    env:
      DRIVER: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: testing/playwright/package-lock.json

      - name: Install Playwright dependencies
        working-directory: testing/playwright
        run: npm ci

      - name: Install Playwright browsers
        working-directory: testing/playwright
        run: npx playwright install --with-deps chromium

      - name: Bootstrap containerized IPAM
        run: bash testing/playwright/bootstrap-app.sh "$DRIVER"

      - name: Run Playwright suite
        working-directory: testing/playwright
        env:
          IPAM_BASE_URL: https://127.0.0.1:8443
          IPAM_ADMIN_USER: demo
          IPAM_ADMIN_PASS: demo
          CI: 'true'
        run: npx playwright test

      - name: Container logs on failure
        if: failure()
        run: docker logs ipam-pw-test || true

      - name: Tear down containerized IPAM
        if: always()
        run: bash testing/playwright/teardown-app.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.driver }}
          path: testing/playwright/playwright-report/
          retention-days: 7

  htaccess-subset:
    name: .htaccess coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: testing/playwright/package-lock.json

      - name: Install Playwright dependencies
        working-directory: testing/playwright
        run: npm ci

      - name: Install Playwright browsers
        working-directory: testing/playwright
        run: npx playwright install --with-deps chromium

      - name: Bootstrap containerized IPAM
        run: bash testing/playwright/bootstrap-app.sh sqlite

      - name: Run .htaccess spec only
        working-directory: testing/playwright
        env:
          IPAM_BASE_URL: https://127.0.0.1:8443
          CI: 'true'
        run: npx playwright test tests/htaccess.spec.ts

      - name: Container logs on failure
        if: failure()
        run: docker logs ipam-pw-test || true

      - name: Tear down containerized IPAM
        if: always()
        run: bash testing/playwright/teardown-app.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-htaccess
          path: testing/playwright/playwright-report/
          retention-days: 7

  api-tests:
    name: API regression (test_api.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, openssl
          coverage: none

      - name: Bootstrap containerized IPAM
        run: bash testing/playwright/bootstrap-app.sh sqlite

      - name: Run API regression suite
        # #451: test_api.sh now accepts DOCKER_CONTAINER and routes auto-API-key
        # creation through `docker exec` instead of ssh. The container name
        # matches bootstrap-app.sh's default.
        env:
          DOCKER_CONTAINER: ipam-pw-test
        run: bash testing/scripts/test_api.sh https://127.0.0.1:8443

      - name: Container logs on failure
        if: failure()
        run: docker logs ipam-pw-test || true

      - name: Tear down containerized IPAM
        if: always()
        run: bash testing/playwright/teardown-app.sh
