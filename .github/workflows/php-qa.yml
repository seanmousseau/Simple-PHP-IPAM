name: PHP QA

# ---------------------------------------------------------------------------
# Tier 1 — fast per-commit CI (#411).
#
# Runs on every push to dev/main and every PR targeting dev or main. Target
# wall clock: 5–8 minutes. Blocks merge.
#
# Engine matrix: SQLite (v2.9.0), MySQL (v2.10.0 #384), Postgres (v2.11.0
# #388). `fail-fast: false` means one engine's failure does not cancel the
# others' runs — we want to see all engine failures at once.
#
# Tier 2 (path-filtered migration round-trip tests) and Tier 3 (nightly,
# informational) live in their own workflow files. See docs/ci.md.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Cancel in-progress runs for the same ref when a new commit lands. Saves
# minutes on busy PRs without hiding the latest result.
concurrency:
  group: php-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: PHP QA (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, mysql, mariadb, pgsql]

    # Service containers. GitHub Actions does not support matrix-gated
    # services, so all of them are always started and simply unused on the
    # slots that don't need them. Cold-start overhead is ~15–20 seconds
    # per service, amortized by the runner cache on warm hits.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: ipam_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rootpw
          MARIADB_DATABASE: ipam_ci
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: rootpw
          POSTGRES_USER: postgres
          POSTGRES_DB: ipam_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ipam_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      IPAM_DB_DRIVER: ${{ matrix.engine == 'mariadb' && 'mysql' || matrix.engine }}
      # Smoke tests skip when the matching DSN env var is empty, so each
      # matrix slot naturally exercises only its own engine's server.
      # MariaDB reuses the mysql driver and DSN env vars on port 3307.
      IPAM_MYSQL_DSN: ${{ (matrix.engine == 'mysql' && 'mysql:host=127.0.0.1;port=3306;dbname=ipam_ci;charset=utf8mb4') || (matrix.engine == 'mariadb' && 'mysql:host=127.0.0.1;port=3307;dbname=ipam_ci;charset=utf8mb4') || '' }}
      IPAM_MYSQL_USER: ${{ (matrix.engine == 'mysql' || matrix.engine == 'mariadb') && 'root' || '' }}
      IPAM_MYSQL_PASS: ${{ (matrix.engine == 'mysql' || matrix.engine == 'mariadb') && 'rootpw' || '' }}
      IPAM_PGSQL_DSN:  ${{ matrix.engine == 'pgsql' && 'pgsql:host=127.0.0.1;port=5432;dbname=ipam_ci' || '' }}
      IPAM_PGSQL_USER: ${{ matrix.engine == 'pgsql' && 'postgres' || '' }}
      IPAM_PGSQL_PASS: ${{ matrix.engine == 'pgsql' && 'rootpw' || '' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, mbstring, openssl
          coverage: none

      # ----- Composer cache (#411) -----
      # Keyed on composer.lock so a no-dep PR doesn't bust the cache. Saves
      # ~20–30s per job and compounds across matrix slots once MySQL and
      # Postgres land.
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit (security advisories)
        # #416: fail the build on any known CVE in a runtime or dev dep.
        # Runs after install so the lock file's resolved versions are checked.
        run: composer audit --no-dev --locked

      - name: PHP Lint
        run: find Simple-PHP-IPAM -name '*.php' -not -path '*/data/*' | sort | xargs -n1 php -l

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: PHPCS
        run: vendor/bin/phpcs

      - name: PHPUnit
        run: vendor/bin/phpunit

      # ----- MySQL slot only: test_api.sh against php -S backed by MySQL -----
      #
      # Runs the full ~150-assertion API regression suite against a fresh
      # php -S webserver pointed at the MySQL service container. This
      # catches MySQL-specific breakage in the page handlers (bound
      # parameters, pagination SQL, REST API endpoints) that unit tests
      # alone do not exercise. The sqlite slot already has Playwright
      # coverage via playwright.yml and does not need this step.
      - name: Bootstrap php -S + config for test_api.sh (mysql)
        if: matrix.engine == 'mysql'
        run: |
          cat > Simple-PHP-IPAM/config.php <<'PHP'
          <?php
          return [
              'db_driver' => 'mysql',
              'db_dsn'    => 'mysql:host=127.0.0.1;port=3306;dbname=ipam_ci;charset=utf8mb4',
              'db_user'   => 'root',
              'db_pass'   => 'rootpw',
              'bootstrap_admin' => [
                  'username' => 'admin',
                  'password' => 'ChangeMeNow!12345',
              ],
              'force_https' => false,
              'session_idle_seconds' => 1800,
          ];
          PHP

      - name: Start php -S (mysql)
        if: matrix.engine == 'mysql'
        run: |
          php -S 127.0.0.1:8080 -t Simple-PHP-IPAM > /tmp/php-s.log 2>&1 &
          echo $! > /tmp/php-s.pid
          # Wait for readiness (up to 30 s)
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8080/status.php > /tmp/status.json 2>/dev/null; then
              echo "php -S ready"
              cat /tmp/status.json
              exit 0
            fi
            sleep 1
          done
          echo "php -S failed to start" >&2
          cat /tmp/php-s.log >&2
          exit 1

      - name: Create temp API key in MySQL for test_api.sh
        if: matrix.engine == 'mysql'
        id: mysql-api-key
        run: |
          export IPAM_API_KEY="ci-mysql-$(date +%s)-$RANDOM"
          export IPAM_API_KEY_HASH="$(php -r 'echo hash("sha256", getenv("IPAM_API_KEY"));')"
          php -r '
            $db = new PDO(getenv("IPAM_MYSQL_DSN"), getenv("IPAM_MYSQL_USER"), getenv("IPAM_MYSQL_PASS"), [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
            $db->exec("DELETE FROM api_keys WHERE name = \"test-runner\"");
            $st = $db->prepare("INSERT INTO api_keys (name, key_hash, is_active, created_by) VALUES (\"test-runner\", :h, 1, \"ci\")");
            $st->execute([":h" => getenv("IPAM_API_KEY_HASH")]);
            echo "inserted\n";
          '
          echo "key=$IPAM_API_KEY" >> "$GITHUB_OUTPUT"

      - name: Run test_api.sh against MySQL-backed php -S
        if: matrix.engine == 'mysql'
        env:
          API_KEY: ${{ steps.mysql-api-key.outputs.key }}
        run: bash testing/scripts/test_api.sh http://127.0.0.1:8080

      - name: Stop php -S (mysql)
        if: always() && matrix.engine == 'mysql'
        run: |
          if [ -f /tmp/php-s.pid ]; then
            kill "$(cat /tmp/php-s.pid)" 2>/dev/null || true
          fi

      # ----- MariaDB slot only: test_api.sh against php -S backed by MariaDB -----
      #
      # v2.12.0 #534: first-class MariaDB 10.11+ support. Reuses the mysql
      # PDO driver on port 3307 (the MariaDB service container).
      - name: Bootstrap php -S + config for test_api.sh (mariadb)
        if: matrix.engine == 'mariadb'
        run: |
          cat > Simple-PHP-IPAM/config.php <<'PHP'
          <?php
          return [
              'db_driver' => 'mysql',
              'db_dsn'    => 'mysql:host=127.0.0.1;port=3307;dbname=ipam_ci;charset=utf8mb4',
              'db_user'   => 'root',
              'db_pass'   => 'rootpw',
              'bootstrap_admin' => [
                  'username' => 'admin',
                  'password' => 'ChangeMeNow!12345',
              ],
              'force_https' => false,
              'session_idle_seconds' => 1800,
          ];
          PHP

      - name: Start php -S (mariadb)
        if: matrix.engine == 'mariadb'
        run: |
          php -S 127.0.0.1:8080 -t Simple-PHP-IPAM > /tmp/php-s.log 2>&1 &
          echo $! > /tmp/php-s.pid
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8080/status.php > /tmp/status.json 2>/dev/null; then
              echo "php -S ready"
              cat /tmp/status.json
              exit 0
            fi
            sleep 1
          done
          echo "php -S failed to start" >&2
          cat /tmp/php-s.log >&2
          exit 1

      - name: Create temp API key in MariaDB for test_api.sh
        if: matrix.engine == 'mariadb'
        id: mariadb-api-key
        run: |
          export IPAM_API_KEY="ci-mariadb-$(date +%s)-$RANDOM"
          export IPAM_API_KEY_HASH="$(php -r 'echo hash("sha256", getenv("IPAM_API_KEY"));')"
          php -r '
            $db = new PDO(getenv("IPAM_MYSQL_DSN"), getenv("IPAM_MYSQL_USER"), getenv("IPAM_MYSQL_PASS"), [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
            $db->exec("DELETE FROM api_keys WHERE name = \"test-runner\"");
            $st = $db->prepare("INSERT INTO api_keys (name, key_hash, is_active, created_by) VALUES (\"test-runner\", :h, 1, \"ci\")");
            $st->execute([":h" => getenv("IPAM_API_KEY_HASH")]);
            echo "inserted\n";
          '
          echo "key=$IPAM_API_KEY" >> "$GITHUB_OUTPUT"

      - name: Run test_api.sh against MariaDB-backed php -S
        if: matrix.engine == 'mariadb'
        env:
          API_KEY: ${{ steps.mariadb-api-key.outputs.key }}
        run: bash testing/scripts/test_api.sh http://127.0.0.1:8080

      - name: Stop php -S (mariadb)
        if: always() && matrix.engine == 'mariadb'
        run: |
          if [ -f /tmp/php-s.pid ]; then
            kill "$(cat /tmp/php-s.pid)" 2>/dev/null || true
          fi

      # ----- Postgres slot only: test_api.sh against php -S backed by Postgres -----
      #
      # Parallels the MySQL slot above. Runs the full ~150-assertion API
      # regression suite against a fresh php -S webserver pointed at the
      # Postgres service container. v2.11.0 #388.
      - name: Bootstrap php -S + config for test_api.sh (pgsql)
        if: matrix.engine == 'pgsql'
        run: |
          cat > Simple-PHP-IPAM/config.php <<'PHP'
          <?php
          return [
              'db_driver' => 'pgsql',
              'db_dsn'    => 'pgsql:host=127.0.0.1;port=5432;dbname=ipam_ci',
              'db_user'   => 'postgres',
              'db_pass'   => 'rootpw',
              'bootstrap_admin' => [
                  'username' => 'admin',
                  'password' => 'ChangeMeNow!12345',
              ],
              'force_https' => false,
              'session_idle_seconds' => 1800,
          ];
          PHP

      - name: Start php -S (pgsql)
        if: matrix.engine == 'pgsql'
        run: |
          php -S 127.0.0.1:8080 -t Simple-PHP-IPAM > /tmp/php-s.log 2>&1 &
          echo $! > /tmp/php-s.pid
          # Wait for readiness (up to 30 s)
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8080/status.php > /tmp/status.json 2>/dev/null; then
              echo "php -S ready"
              cat /tmp/status.json
              exit 0
            fi
            sleep 1
          done
          echo "php -S failed to start" >&2
          cat /tmp/php-s.log >&2
          exit 1

      - name: Create temp API key in Postgres for test_api.sh
        if: matrix.engine == 'pgsql'
        id: pgsql-api-key
        run: |
          export IPAM_API_KEY="ci-pgsql-$(date +%s)-$RANDOM"
          export IPAM_API_KEY_HASH="$(php -r 'echo hash("sha256", getenv("IPAM_API_KEY"));')"
          php -r '
            $db = new PDO(getenv("IPAM_PGSQL_DSN"), getenv("IPAM_PGSQL_USER"), getenv("IPAM_PGSQL_PASS"), [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
            $db->exec("DELETE FROM api_keys WHERE name = '"'"'test-runner'"'"'");
            $st = $db->prepare("INSERT INTO api_keys (name, key_hash, is_active, created_by) VALUES ('"'"'test-runner'"'"', :h, 1, '"'"'ci'"'"')");
            $st->execute([":h" => getenv("IPAM_API_KEY_HASH")]);
            echo "inserted\n";
          '
          echo "key=$IPAM_API_KEY" >> "$GITHUB_OUTPUT"

      - name: Run test_api.sh against Postgres-backed php -S
        if: matrix.engine == 'pgsql'
        env:
          API_KEY: ${{ steps.pgsql-api-key.outputs.key }}
        run: bash testing/scripts/test_api.sh http://127.0.0.1:8080

      - name: Stop php -S (pgsql)
        if: always() && matrix.engine == 'pgsql'
        run: |
          if [ -f /tmp/php-s.pid ]; then
            kill "$(cat /tmp/php-s.pid)" 2>/dev/null || true
          fi

      # SchemaParityTest runs inside this matrix slot (via `vendor/bin/phpunit`
      # above). Each slot exercises its own engine's canonicalisation; the
      # assertion that all three schema.*.sql files converge is exercised
      # implicitly because the SQLite path always runs and the MySQL/Postgres
      # paths activate via IPAM_*_DSN on their respective matrix slots.
