name: Playwright

# Containerized Playwright harness for Simple PHP IPAM.
#
# Runs on PRs targeting dev/main and on manual dispatch only — push
# triggers were removed in v3.26.0 to keep CI minutes scoped to PR
# review cycles. Four-engine matrix
# (sqlite, mysql, mariadb, pgsql) exercises the full ~400-test suite against
# real service containers inside Dockerized Apache+PHP.
#
# - `containerized-playwright` — full E2E suite per engine
# - `htaccess-subset` — HTTP-level .htaccess deny rule verification
# - `api-tests` — testing/scripts/test_api.sh API regression suite
#
# All jobs use testing/playwright/Dockerfile.apache.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - 'Simple-PHP-IPAM/**'
      - 'testing/playwright/**'
      - 'testing/scripts/**'
      - '.github/workflows/playwright.yml'

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containerized-playwright:
    name: Playwright (${{ matrix.driver }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        driver: [sqlite, mysql, mariadb, pgsql]
    env:
      DRIVER: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: testing/playwright/package-lock.json

      - name: Install Playwright dependencies
        working-directory: testing/playwright
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ hashFiles('testing/playwright/package-lock.json') }}-${{ runner.os }}

      - name: Install Playwright browsers
        working-directory: testing/playwright
        env:
          PW_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [[ "$PW_CACHE_HIT" == "true" ]]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build IPAM Docker image (GHA layer cache)
        run: |
          docker buildx build \
            --cache-from type=gha,scope=ipam-apache-docker \
            --cache-to  type=gha,scope=ipam-apache-docker,mode=max \
            --load \
            -t ipam-pw-apache:local \
            -f testing/playwright/Dockerfile.apache \
            testing/playwright

      - name: Install Composer dependencies
        run: composer install --no-dev --no-progress --quiet

      - name: Bootstrap containerized IPAM
        run: bash testing/playwright/bootstrap-app.sh "$DRIVER"

      - name: Run Playwright suite
        working-directory: testing/playwright
        env:
          IPAM_BASE_URL: https://127.0.0.1:8443
          IPAM_ADMIN_USER: demo
          IPAM_ADMIN_PASS: demo
          IPAM_DRIVER: ${{ matrix.driver }}
          CI: 'true'
        run: npx playwright test --project=chromium

      # v3.29.0 #900 originally enabled vr-* (visual-regression projects) on the
      # sqlite matrix slot in CI. The baselines committed under
      # tests/visual-regression.spec.ts-snapshots/ are platform-suffixed
      # (`*-darwin.png`) because they were generated on the maintainer's macOS
      # workstation; CI runs on Linux and Playwright looks for `*-linux.png`,
      # which don't exist — every vr-* run fails with "A snapshot doesn't
      # exist, writing actual." Disabled here until linux baselines are
      # generated (see follow-up #1206). vr-* still runs locally during the
      # 3-driver release gate.
      # - name: Run Playwright visual-regression projects (sqlite only)
      #   if: matrix.driver == 'sqlite'
      #   working-directory: testing/playwright
      #   env:
      #     IPAM_BASE_URL: https://127.0.0.1:8443
      #     IPAM_ADMIN_USER: demo
      #     IPAM_ADMIN_PASS: demo
      #     IPAM_DRIVER: ${{ matrix.driver }}
      #     CI: 'true'
      #   run: npx playwright test --project=vr-1440 --project=vr-1024 --project=vr-768 --project=vr-375

      - name: Container logs on failure
        if: failure()
        run: docker logs ipam-pw-test || true

      - name: Tear down containerized IPAM
        if: always()
        run: bash testing/playwright/teardown-app.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.driver }}
          path: testing/playwright/playwright-report/
          retention-days: 7

  htaccess-subset:
    name: .htaccess coverage (${{ matrix.webserver }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        webserver: [apache, openlitespeed]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: testing/playwright/package-lock.json

      - name: Install Playwright dependencies
        working-directory: testing/playwright
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ hashFiles('testing/playwright/package-lock.json') }}-${{ runner.os }}

      - name: Install Playwright browsers
        working-directory: testing/playwright
        env:
          PW_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [[ "$PW_CACHE_HIT" == "true" ]]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Set up Docker Buildx
        if: matrix.webserver == 'apache'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build IPAM Docker image (GHA layer cache)
        if: matrix.webserver == 'apache'
        run: |
          docker buildx build \
            --cache-from type=gha,scope=ipam-apache-docker \
            --cache-to  type=gha,scope=ipam-apache-docker,mode=max \
            --load \
            -t ipam-pw-apache:local \
            -f testing/playwright/Dockerfile.apache \
            testing/playwright

      # Apache: boots the full Dockerized Apache+PHP harness on HTTPS :8443
      # with a seeded SQLite database. Postgres/MySQL matrix slots do not
      # apply here — the .htaccess assertions are HTTP-level and don't care
      # about the backing driver.
      - name: Bootstrap containerized IPAM (apache)
        if: matrix.webserver == 'apache'
        run: bash testing/playwright/bootstrap-app.sh sqlite

      # OpenLiteSpeed (v2.11.0 #500): boots the stock
      # litespeedtech/openlitespeed image with the Simple-PHP-IPAM tree
      # mounted read-only at the Example vhost docroot. No database, no
      # seeding — the .htaccess regression guard is HTTP-level. OLS has a
      # known quirk where lsphp dispatches PHP files BEFORE a subdirectory
      # .htaccess rewrite rule fires, so blocking `/dialects/*.php` and
      # `/vendor/*.php` requires root-level RewriteRules rather than the
      # subdirectory `Require all denied` pattern Apache honours. This job
      # is the regression guard that keeps the root-level blocks in place.
      - name: Bootstrap containerized IPAM (openlitespeed)
        if: matrix.webserver == 'openlitespeed'
        run: bash testing/playwright/bootstrap-ols.sh

      - name: Run .htaccess spec (apache)
        if: matrix.webserver == 'apache'
        working-directory: testing/playwright
        env:
          IPAM_BASE_URL: https://127.0.0.1:8443
          CI: 'true'
        run: npx playwright test tests/htaccess.spec.ts

      - name: Run .htaccess spec (openlitespeed)
        if: matrix.webserver == 'openlitespeed'
        working-directory: testing/playwright
        env:
          # OLS's Example vhost listens on plain HTTP :8088 out of the box
          # (bootstrap-ols.sh maps it to host :8089 to avoid colliding with
          # the Apache harness on machines running both side-by-side). The
          # htaccess spec sends `X-Forwarded-Proto: https` on every request
          # so the root-level force-HTTPS redirect skips and every other
          # deny rule still fires.
          IPAM_BASE_URL: http://127.0.0.1:8089
          CI: 'true'
        run: npx playwright test tests/htaccess.spec.ts

      - name: Container logs on failure (apache)
        if: failure() && matrix.webserver == 'apache'
        run: docker logs ipam-pw-test || true

      - name: Container logs on failure (openlitespeed)
        if: failure() && matrix.webserver == 'openlitespeed'
        run: docker logs ipam-ols-test || true

      - name: Tear down containerized IPAM (apache)
        if: always() && matrix.webserver == 'apache'
        run: bash testing/playwright/teardown-app.sh

      - name: Tear down containerized IPAM (openlitespeed)
        if: always() && matrix.webserver == 'openlitespeed'
        run: bash testing/playwright/teardown-ols.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-htaccess-${{ matrix.webserver }}
          path: testing/playwright/playwright-report/
          retention-days: 7

  alerts-smtp:
    name: Alerts SMTP (MailHog)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: testing/playwright/package-lock.json

      - name: Setup PHP + Composer
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, openssl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      - name: Install runtime Composer dependencies
        run: composer install --no-dev --no-progress --quiet

      - name: Install Playwright dependencies
        working-directory: testing/playwright
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ hashFiles('testing/playwright/package-lock.json') }}-${{ runner.os }}

      - name: Install Playwright browsers
        working-directory: testing/playwright
        env:
          PW_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [[ "$PW_CACHE_HIT" == "true" ]]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build IPAM Docker image (GHA layer cache)
        run: |
          docker buildx build \
            --cache-from type=gha,scope=ipam-apache-docker \
            --cache-to  type=gha,scope=ipam-apache-docker,mode=max \
            --load \
            -t ipam-pw-apache:local \
            -f testing/playwright/Dockerfile.apache \
            testing/playwright

      - name: Bootstrap containerized IPAM with MailHog
        env:
          IPAM_TEST_MAILHOG: '1'
        run: bash testing/playwright/bootstrap-app.sh sqlite

      - name: Run alerts-smtp spec
        working-directory: testing/playwright
        env:
          IPAM_BASE_URL: https://127.0.0.1:8443
          IPAM_ADMIN_USER: demo
          IPAM_ADMIN_PASS: demo
          CI: 'true'
        run: npx playwright test tests/alerts-smtp.spec.ts tests/email_otp.spec.ts --project=chromium

      - name: Container logs on failure
        if: failure()
        run: docker logs ipam-pw-test || true

      - name: Tear down containerized IPAM
        if: always()
        env:
          IPAM_TEST_MAILHOG: '1'
        run: bash testing/playwright/teardown-app.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-alerts-smtp
          path: testing/playwright/playwright-report/
          retention-days: 7

  api-tests:
    name: API regression (test_api.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, openssl
          coverage: none

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build IPAM Docker image (GHA layer cache)
        run: |
          docker buildx build \
            --cache-from type=gha,scope=ipam-apache-docker \
            --cache-to  type=gha,scope=ipam-apache-docker,mode=max \
            --load \
            -t ipam-pw-apache:local \
            -f testing/playwright/Dockerfile.apache \
            testing/playwright

      - name: Bootstrap containerized IPAM
        run: bash testing/playwright/bootstrap-app.sh sqlite

      - name: Run API regression suite
        # #451: test_api.sh now accepts DOCKER_CONTAINER and routes auto-API-key
        # creation through `docker exec` instead of ssh. The container name
        # matches bootstrap-app.sh's default.
        env:
          DOCKER_CONTAINER: ipam-pw-test
        run: bash testing/scripts/test_api.sh https://127.0.0.1:8443

      - name: Container logs on failure
        if: failure()
        run: docker logs ipam-pw-test || true

      - name: Tear down containerized IPAM
        if: always()
        run: bash testing/playwright/teardown-app.sh
