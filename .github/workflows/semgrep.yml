name: Semgrep

on:
  pull_request:
    branches: [dev, main]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run custom security rules
        run: semgrep --config=.semgrep/rules.yml --error Simple-PHP-IPAM/
