name: Semgrep

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run custom security rules
        run: semgrep --config=.semgrep/rules.yml --error Simple-PHP-IPAM/
