name: Semgrep

on:
  pull_request:
    branches: [dev, main]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run custom security rules
        run: semgrep --config=.semgrep/rules.yml --error Simple-PHP-IPAM/
