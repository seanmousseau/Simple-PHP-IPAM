services:
  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    container_name: claude-chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --disable-features=HttpsUpgrades,AutoupgradeHttpsOnly
      - --hide-scrollbars
    ports:
      - "9224:9222"
    shm_size: 256m
