reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  poem: false
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  abort_on_close: true

  path_filters:
    - "!vendor/**"
    - "!releases/**"
    - "!Simple-PHP-IPAM/data/**"
    - "!*.sqlite"
    - "!*.sqlite-wal"
    - "!*.sqlite-shm"
    - "!composer.lock"

  path_instructions:
    - path: "Simple-PHP-IPAM/**/*.php"
      instructions: |
        This is a PHP 8.2+ application with no Composer runtime dependencies.
        Key conventions:
        - All HTML output must go through e() (wraps htmlspecialchars) — never echo user data raw.
        - Every POST handler must call csrf_require() at the top and include a hidden csrf field.
        - Use PDO prepared statements; never concatenate user input into SQL.
        - ip_bin/network_bin columns are raw binary blobs (inet_pton output), not UTF-8 strings.
        - The addresses table has no ip_version column — that lives only on subnets.
        - addresses.grp is a SQL reserved word — stored as grp, exposed as group in UI/API.
        - fetch() returns false on no rows, not null — always check with if ($row).
        - Audit every significant action with the audit() helper.
        - page_footer() does not call exit — never output after it.
        - $config is a global set by init.php; access via global $config inside functions.
        - All migrations must be idempotent — guard ALTER TABLE with PRAGMA table_info() checks.
        - Tags are managed via tags, subnet_tags, address_tags tables. Both join tables have
          ON DELETE CASCADE — ensure cascade is in place and never manually delete join rows
          when deleting a tag or entity; the DB handles it.
        - VLAN foreign key is subnets.vlan_fk (FK to vlans.id); subnets.vlan_id is a legacy
          integer field (1–4094) — do not confuse them.
        - Site hierarchy: sites.parent_id is a self-referential FK. Max depth is 2 (enforced
          at the application layer). Always check for circular references when setting parent_id.
        - mail() calls for utilization alerts must sanitize $to and $subject with
          preg_replace('/[\r\n]/', '', ...) before use to prevent header injection.

    - path: "Simple-PHP-IPAM/api.php"
      instructions: |
        api.php is a stateless REST endpoint — it does not use init.php or sessions.
        All authentication is via API key: the raw key is hashed with hash('sha256', $rawKey)
        and looked up in api_keys.key_hash via a prepared statement (SQL comparison, not hash_equals).
        Ensure every response sets Content-Type: application/json and returns consistent
        JSON shape: {"data": ..., "meta": ...} or {"error": "..."}.

    - path: "Simple-PHP-IPAM/migrations.php"
      instructions: |
        Migrations must be idempotent. Every ALTER TABLE must check PRAGMA table_info()
        first. Migration keys must sort correctly under ksort(SORT_NATURAL). New migrations
        must have a corresponding version bump in version.php and CHANGELOG.md entry.

    - path: ".github/workflows/**"
      instructions: |
        Workflows must pin third-party actions to a full commit SHA, not a mutable tag.
        Ensure PHP QA jobs test PHP 8.2 (minimum supported version).

    - path: "tests/**"
      instructions: |
        PHPUnit tests cover pure utility functions in lib.php only (no DB, no session).
        Do not add tests that require database connections or HTTP calls.

    - path: "testing/playwright/**"
      instructions: |
        Playwright tests use @playwright/test with TypeScript. Key conventions:
        - Workers are set to 1 (sequential) — tests share a single SQLite DB; avoid state leakage.
        - Use expect() assertions; avoid hard waits (waitForTimeout) — prefer waitForSelector/locator.
        - Fixtures and helpers live in testing/playwright/fixtures/; reuse them rather than duplicating login logic.
        - Test data created by a test must be cleaned up in the same test (afterEach or try/finally).
        - The base URL comes from the IPAM_BASE_URL env var; never hardcode URLs.
        - Screenshots on failure are configured in playwright.config.ts — do not add manual screenshot calls.
        - VLAN constants: TEST_VLAN_ID=99, TEST_VLAN_NAME='pw-test-vlan'. Use createVlan/deleteVlan helpers.
        - Tag constants: TEST_TAG_NAME='pw-test-tag', TEST_TAG_COLOUR='#ff0000'. Use createTag/deleteTag helpers.
        - Contact constants: TEST_CONTACT_NAME, TEST_CONTACT_EMAIL, TEST_CONTACT_ORG — defined in fixtures/ipam.ts.
        - VRF constants: TEST_VRF_NAME, TEST_VRF_DESC, TEST_VRF_RD, TEST_VRF_CIDR — defined in fixtures/ipam.ts.
        - DHCP constant: TEST_DHCP_CIDR='10.55.0.0/24' — defined in fixtures/ipam.ts.

    - path: "testing/playwright/tests/contacts.spec.ts"
      instructions: |
        Tests contacts.php CRUD, contact-address owner_contact_id typeahead integration,
        readonly-user 403 guard, and API ?resource=contacts endpoint. Key invariants:
        - beforeAll must clean up stale pw-test-contact records from previous failed runs.
        - afterAll context.close() must always run.
        - The contacts page requires admin role; test readonly access via fetchGet (not browser navigation).
        - Contact name is required — verify required attribute; avoid empty-name submissions.

    - path: "testing/playwright/tests/vrfs.spec.ts"
      instructions: |
        Tests vrfs.php CRUD, VRF picker on subnets.php (select[name=vrf_id]), VRF badge
        (.badge containing "VRF: <name>"), delete-guard when subnets are assigned (button disabled),
        and API ?resource=vrfs. Key invariants:
        - beforeAll must clean up stale pw-test-vrf records and their associated subnets.
        - "Cannot delete" test must check the disabled attribute on the delete button — the server
          also blocks it, but the UI guard is first.
        - VRF picker only renders if vrfList is non-empty — create the VRF before testing the picker.

    - path: "testing/playwright/tests/dhcp_pool.spec.ts"
      instructions: |
        Tests dhcp_pool.php subnet picker, reserve_pool action, clear_pool action, and
        readonly-user write-form hiding. Key invariants:
        - beforeAll must create the TEST_DHCP_CIDR (10.55.0.0/24) subnet if absent; afterAll must delete it.
        - Navigate via ?subnet_id= query param (not the select auto-submit) to ensure deterministic routing.
        - Reserve range 10.55.0.10–10.55.0.20 (11 IPs); verify .success message and table entries.
        - Clear range must remove the reserved records; verify .empty-state appears.
        - Readonly user must not see reserve_pool / clear_pool forms.

    - path: "testing/playwright/tests/large-db.spec.ts"
      instructions: |
        This spec tests db_tools.php with large SQL payloads (100+ subnets, 5 000+ addresses).
        Key invariants:
        - The afterAll MUST restore the original DB — if this breaks, all subsequent specs fail.
        - Use test.setTimeout() inside the test body (not as a third argument) for large imports.
        - INSERT … SELECT FROM subnets is allowed by db_tools.php (first word is INSERT, not SELECT).
        - CIDR space for synthetic data: 172.17–172.27.x.0/24 — confirmed not to conflict with demo data.
        - Test order matters: export must run after import, round-trip after export.

    - path: "testing/playwright/tests/upgrade.spec.ts"
      instructions: |
        This spec tests the database upgrade path from pre-v2.0.0 schema to the current version.
        Key invariants:
        - The afterAll MUST restore the original DB — failure here breaks all subsequent specs.
        - The pre-v2 SQL must NOT include v2.x tables (vlans, vrfs, contacts, tags, subnet_tags,
          address_tags, alert_state) or v2.x columns (vlan_fk, vrf_id on subnets; mac,
          expires_at, owner_contact_id on addresses; parent_id on sites; theme on users).
        - Migration stamps in the pre-v2 SQL must stop at '1.13' so '1.19.0' (adds mac/expires_at),
          all '2.0.0-*', and all '2.1.0-*' migrations run on the first page load after import.
        - After import, the beforeAll navigates to logout.php before login.php to clear the
          admin session; otherwise upgrade-test-admin at id=1 inherits the real admin session.
        - The pre-v2 admin user hash must be a valid bcrypt hash for a known password so tests
          can log in after migration.
        - UPGRADE_ADMIN_HASH: bcrypt hash for 'admin' (cost 12, generated on PHP 8.2).

    - path: "testing/samples/upgrade-snapshots/**"
      instructions: |
        SQL dumps representing the database at historical schema checkpoints.
        These are imported via db_tools.php in upgrade tests — they must be valid SQL that
        passes db_tools.php's import whitelist (INSERT, CREATE, DROP, DELETE only; no SELECT
        standalone, no PRAGMA except foreign_keys, no ATTACH/DETACH).
        When adding a new snapshot, document it in testing/samples/upgrade-snapshots/README.md.

    - path: "Simple-PHP-IPAM/vlans.php"
      instructions: |
        vlans.php is the VLAN admin CRUD page. Key invariants:
        - Requires admin role — call require_role('admin') at top.
        - vlan_id must be between 1 and 4094 (enforced by DB CHECK constraint too).
        - Audit every create/update/delete with vlan.create / vlan.update / vlan.delete.
        - subnets.vlan_fk is the FK; subnets.vlan_id is the legacy integer — display both correctly.

    - path: "Simple-PHP-IPAM/vrfs.php"
      instructions: |
        vrfs.php is the VRF (Virtual Routing and Forwarding) admin CRUD page. Key invariants:
        - Requires admin role — call require_role('admin') at top.
        - VRF name must be unique (UNIQUE constraint on vrfs.name).
        - Cannot delete a VRF that has subnets assigned (check subnets.vrf_id reference).
        - Audit every create/update/delete with vrf.create / vrf.update / vrf.delete.
        - rd (Route Distinguisher) is free-form text, no format validation required.
        - subnets.vrf_id = NULL means the global/default VRF (not "no VRF").
        - UNIQUE(cidr, vrf_id) in subnets uses IS NULL comparison for NULL-safe check.

    - path: "Simple-PHP-IPAM/contacts.php"
      instructions: |
        contacts.php is the Contacts admin CRUD page. Key invariants:
        - Requires admin role — call require_role('admin') at top.
        - Contact name is required; email, phone, org, note are optional free-text.
        - Contacts are linked to addresses via addresses.owner_contact_id (nullable FK).
        - Deleting a contact sets addresses.owner_contact_id = NULL (ON DELETE SET NULL).
        - Audit every create/update/delete with contact.create / contact.update / contact.delete.
        - The owner field in addresses remains free-text for backwards compatibility;
          owner_contact_id is an optional overlay, not a replacement.

    - path: "Simple-PHP-IPAM/tags.php"
      instructions: |
        tags.php is the tag admin CRUD page. Key invariants:
        - Requires admin role — call require_role('admin') at top.
        - Tags are linked to subnets/addresses via subnet_tags/address_tags join tables.
        - Audit every create/update/delete with tag.create / tag.update / tag.delete.
        - ON DELETE CASCADE handles join table cleanup automatically; no need to manually delete rows.

  tools:
    github-checks:
      enabled: true
      timeout_ms: 90000
    semgrep:
      enabled: true

chat:
  auto_reply: true

code_generation:
  docstrings:
    language: en-US

language: en-US
tone_instructions: "Be direct and concise. Focus on security and correctness. Skip style nits allowed by .phpcs.xml. Flag XSS, SQLi, CSRF, or path-traversal as blocking."
