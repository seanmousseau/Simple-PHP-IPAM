reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  poem: false
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  abort_on_close: true

  path_filters:
    - "!vendor/**"
    - "!releases/**"
    - "!Simple-PHP-IPAM/data/**"
    - "!*.sqlite"
    - "!*.sqlite-wal"
    - "!*.sqlite-shm"
    - "!composer.lock"

  path_instructions:
    - path: "Simple-PHP-IPAM/**/*.php"
      instructions: |
        This is a PHP 8.2+ application with no Composer runtime dependencies.
        Key conventions:
        - All HTML output must go through e() (wraps htmlspecialchars) — never echo user data raw.
        - Every POST handler must call csrf_require() at the top and include a hidden csrf field.
        - Use PDO prepared statements; never concatenate user input into SQL.
        - ip_bin/network_bin columns are raw binary blobs (inet_pton output), not UTF-8 strings.
        - The addresses table has no ip_version column — that lives only on subnets.
        - addresses.grp is a SQL reserved word — stored as grp, exposed as group in UI/API.
        - fetch() returns false on no rows, not null — always check with if ($row).
        - Audit every significant action with the audit() helper.
        - page_footer() does not call exit — never output after it.
        - $config is a global set by init.php; access via global $config inside functions.
        - All migrations must be idempotent — guard ALTER TABLE with PRAGMA table_info() checks.
        - Tags are managed via tags, subnet_tags, address_tags tables. Both join tables have
          ON DELETE CASCADE — ensure cascade is in place and never manually delete join rows
          when deleting a tag or entity; the DB handles it.
        - VLAN foreign key is subnets.vlan_fk (FK to vlans.id); subnets.vlan_id is a legacy
          integer field (1–4094) — do not confuse them.
        - Site hierarchy: sites.parent_id is a self-referential FK. Max depth is 2 (enforced
          at the application layer). Always check for circular references when setting parent_id.
        - mail() calls for utilization alerts must sanitize $to and $subject with
          preg_replace('/[\r\n]/', '', ...) before use to prevent header injection.

    - path: "Simple-PHP-IPAM/api.php"
      instructions: |
        api.php is a stateless REST endpoint — it does not use init.php or sessions.
        All authentication is via API key: the raw key is hashed with hash('sha256', $rawKey)
        and looked up in api_keys.key_hash via a prepared statement (SQL comparison, not hash_equals).
        Ensure every response sets Content-Type: application/json and returns consistent
        JSON shape: {"data": ..., "meta": ...} or {"error": "..."}.

    - path: "Simple-PHP-IPAM/migrations.php"
      instructions: |
        Migrations must be idempotent. Every ALTER TABLE must check PRAGMA table_info()
        first. Migration keys must sort correctly under ksort(SORT_NATURAL). New migrations
        must have a corresponding version bump in version.php and CHANGELOG.md entry.

    - path: ".github/workflows/**"
      instructions: |
        Workflows must pin third-party actions to a full commit SHA, not a mutable tag.
        Ensure PHP QA jobs test PHP 8.2 (minimum supported version).

    - path: "tests/**"
      instructions: |
        PHPUnit tests cover pure utility functions in lib.php only (no DB, no session).
        Do not add tests that require database connections or HTTP calls.

    - path: "testing/playwright/**"
      instructions: |
        Playwright tests use @playwright/test with TypeScript. Key conventions:
        - Workers are set to 1 (sequential) — tests share a single SQLite DB; avoid state leakage.
        - Use expect() assertions; avoid hard waits (waitForTimeout) — prefer waitForSelector/locator.
        - Fixtures and helpers live in testing/playwright/fixtures/; reuse them rather than duplicating login logic.
        - Test data created by a test must be cleaned up in the same test (afterEach or try/finally).
        - The base URL comes from the IPAM_BASE_URL env var; never hardcode URLs.
        - Screenshots on failure are configured in playwright.config.ts — do not add manual screenshot calls.
        - VLAN constants: TEST_VLAN_ID=99, TEST_VLAN_NAME='pw-test-vlan'. Use createVlan/deleteVlan helpers.
        - Tag constants: TEST_TAG_NAME='pw-test-tag', TEST_TAG_COLOUR='#ff0000'. Use createTag/deleteTag helpers.

    - path: "Simple-PHP-IPAM/vlans.php"
      instructions: |
        vlans.php is the VLAN admin CRUD page. Key invariants:
        - Requires admin role — call require_role('admin') at top.
        - vlan_id must be between 1 and 4094 (enforced by DB CHECK constraint too).
        - Audit every create/update/delete with vlan.create / vlan.update / vlan.delete.
        - subnets.vlan_fk is the FK; subnets.vlan_id is the legacy integer — display both correctly.

    - path: "Simple-PHP-IPAM/tags.php"
      instructions: |
        tags.php is the tag admin CRUD page. Key invariants:
        - Requires admin role — call require_role('admin') at top.
        - Tags are linked to subnets/addresses via subnet_tags/address_tags join tables.
        - Audit every create/update/delete with tag.create / tag.update / tag.delete.
        - ON DELETE CASCADE handles join table cleanup automatically; no need to manually delete rows.

  tools:
    github-checks:
      enabled: true
      timeout_ms: 90000
    semgrep:
      enabled: true

chat:
  auto_reply: true

code_generation:
  docstrings:
    language: en-US

language: en-US
tone_instructions: "Be direct and concise. Focus on security and correctness. Skip style nits allowed by .phpcs.xml. Flag XSS, SQLi, CSRF, or path-traversal as blocking."
