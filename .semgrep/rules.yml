rules:

  # ---------------------------------------------------------------------------
  # XSS: print() of unsanitized user input
  #
  # Taint sources: $_GET, $_POST, $_REQUEST, $_COOKIE
  # Sanitizers:    e() [project wrapper for htmlspecialchars], htmlspecialchars(),
  #                (int)/(float)/(bool) casts, intval(), floatval()
  # Sinks:         print() — semgrep's PHP taint parser does not support echo
  #                as a taint sink (echo is a language construct, not an
  #                expression). The project convention is <?= e($val) ?> anyway.
  # ---------------------------------------------------------------------------
  - id: ipam-xss-unsanitized-print
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sanitizers:
      - pattern: e(...)
      - pattern: htmlspecialchars(...)
      - pattern: htmlentities(...)
      - pattern: (int)$X
      - pattern: (float)$X
      - pattern: (bool)$X
      - pattern: intval(...)
      - pattern: floatval(...)
      - pattern: strip_tags(...)
    pattern-sinks:
      - pattern: print($SINK)
    message: >
      Unsanitized user input ($SOURCE) passed to print() without e() or htmlspecialchars().
      Wrap the value in e() before output: <?= e($value) ?>
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-79
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # Path traversal: unlink() with user-controlled filename
  #
  # Flags unlink() calls where the path derives directly from GET/POST/REQUEST/
  # COOKIE without validation. Session-stored paths and glob()-derived paths
  # are NOT flagged (they are considered application-controlled).
  # ---------------------------------------------------------------------------
  - id: ipam-unlink-user-path
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sanitizers:
      - pattern: basename(...)
      - pattern: $DIR . '/' . basename(...)
      - pattern: realpath(...)
      - pattern: (int)$X
      - pattern: (bool)$X
    pattern-sinks:
      - pattern: unlink($SINK)
      - pattern: "@unlink($SINK)"
    message: >
      unlink() called with a path derived from user input ($SOURCE).
      Validate the path is within an allowed directory before deletion.
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-22
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # SQL injection: PDO query built by string concatenation from user input
  #
  # The project uses prepared statements throughout, but this rule catches any
  # accidental raw concatenation into exec() or query().
  # ---------------------------------------------------------------------------
  - id: ipam-sqli-raw-concat
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sanitizers:
      - pattern: (int)$X
      - pattern: (float)$X
      - pattern: intval(...)
      - pattern: $db->quote(...)
    pattern-sinks:
      - pattern: $db->exec($SINK)
      - pattern: $db->query($SINK)
    message: >
      Raw user input ($SOURCE) concatenated into a PDO exec()/query() call.
      Use a prepared statement with ->prepare() and ->execute().
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-89
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # Email header injection: mail() with unsanitized user input in $to / $subject
  #
  # The project's check_utilization_alerts() function sanitizes these with
  # preg_replace('/[\r\n]/', '', ...) before passing to mail(). This rule flags
  # any mail() call where $to or $subject derives from user-controlled input
  # that has NOT been through that sanitizer.
  # ---------------------------------------------------------------------------
  - id: ipam-mail-header-injection
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sanitizers:
      - pattern: preg_replace('/[\r\n]/', '', ...)
      - pattern: preg_replace("/[\r\n]/", '', ...)
      - pattern: filter_var(...)
      - pattern: (int)$X
    pattern-sinks:
      - pattern: mail($SINK, ...)
      - pattern: mail($TO, $SINK, ...)
    message: >
      mail() called with user input ($SOURCE) in $to or $subject without sanitizing
      \r and \n characters. Use preg_replace('/[\r\n]/', '', $value) before mail().
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-20
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # Scanner IP injection: proc_open() / socket functions with user-controlled IP
  #
  # All IPs passed to proc_open() (ping) or fsockopen() must be validated
  # through normalize_ip() first. This rule flags any such call where the
  # argument derives directly from $_GET/$_POST/$_REQUEST without validation.
  # ---------------------------------------------------------------------------
  - id: ipam-proc-open-safe
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
    pattern-sanitizers:
      - pattern: normalize_ip(...)
      - pattern: filter_var($X, FILTER_VALIDATE_IP)
      - pattern: (int)$X
      - pattern: intval(...)
    pattern-sinks:
      - pattern: proc_open($SINK, ...)
      - pattern: shell_exec($SINK)
      - pattern: system($SINK, ...)
      - pattern: passthru($SINK, ...)
      - pattern: fsockopen($SINK, ...)
      - pattern: pfsockopen($SINK, ...)
    message: >
      User input ($SOURCE) passed to a process/socket function without IP validation.
      Always call normalize_ip() to validate before passing to proc_open/fsockopen.
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-78
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # Open redirect: header('Location: ...') with unvalidated user input
  # ---------------------------------------------------------------------------
  - id: ipam-open-redirect
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
    pattern-sanitizers:
      - pattern: ltrim($X, '/')
      - pattern: parse_url(...)
      - pattern: "\"...\""
      - pattern: "'...'"
    pattern-sinks:
      - pattern: 'header("Location: " . $SINK)'
      - pattern: "header('Location: ' . $SINK)"
      - pattern: 'header("Location: $SINK")'
    message: >
      header('Location: ...') constructed with user input ($SOURCE) without validation.
      Restrict redirects to known-good paths or validate with parse_url().
    languages: [php]
    severity: WARNING
    metadata:
      category: security
      cwe: CWE-601
      confidence: MEDIUM
