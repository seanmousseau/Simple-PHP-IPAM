rules:

  # ---------------------------------------------------------------------------
  # XSS: print() of unsanitized user input
  #
  # Taint sources: $_GET, $_POST, $_REQUEST, $_COOKIE
  # Sanitizers:    e() [project wrapper for htmlspecialchars], htmlspecialchars(),
  #                (int)/(float)/(bool) casts, intval(), floatval()
  # Sinks:         print() — semgrep's PHP taint parser does not support echo
  #                as a taint sink (echo is a language construct, not an
  #                expression). The project convention is <?= e($val) ?> anyway.
  # ---------------------------------------------------------------------------
  - id: ipam-xss-unsanitized-print
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sanitizers:
      - pattern: e(...)
      - pattern: htmlspecialchars(...)
      - pattern: htmlentities(...)
      - pattern: (int)$X
      - pattern: (float)$X
      - pattern: (bool)$X
      - pattern: intval(...)
      - pattern: floatval(...)
      - pattern: strip_tags(...)
    pattern-sinks:
      - pattern: print($SINK)
    message: >
      Unsanitized user input ($SOURCE) passed to print() without e() or htmlspecialchars().
      Wrap the value in e() before output: <?= e($value) ?>
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-79
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # Path traversal: unlink() with user-controlled filename
  #
  # Flags unlink() calls where the path derives directly from GET/POST/REQUEST/
  # COOKIE without validation. Session-stored paths and glob()-derived paths
  # are NOT flagged (they are considered application-controlled).
  # ---------------------------------------------------------------------------
  - id: ipam-unlink-user-path
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sanitizers:
      - pattern: basename(...)
      - pattern: $DIR . '/' . basename(...)
      - pattern: realpath(...)
      - pattern: (int)$X
      - pattern: (bool)$X
    pattern-sinks:
      - pattern: unlink($SINK)
      - pattern: "@unlink($SINK)"
    message: >
      unlink() called with a path derived from user input ($SOURCE).
      Validate the path is within an allowed directory before deletion.
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-22
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # SQL injection: PDO query built by string concatenation from user input
  #
  # The project uses prepared statements throughout, but this rule catches any
  # accidental raw concatenation into exec() or query().
  # ---------------------------------------------------------------------------
  - id: ipam-sqli-raw-concat
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sanitizers:
      - pattern: (int)$X
      - pattern: (float)$X
      - pattern: intval(...)
      - pattern: $db->quote(...)
    pattern-sinks:
      - pattern: $db->exec($SINK)
      - pattern: $db->query($SINK)
    message: >
      Raw user input ($SOURCE) concatenated into a PDO exec()/query() call.
      Use a prepared statement with ->prepare() and ->execute().
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-89
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # Email header injection: mail() with unsanitized user input in $to / $subject
  #
  # The project's check_utilization_alerts() function sanitizes these with
  # preg_replace('/[\r\n]/', '', ...) before passing to mail(). This rule flags
  # any mail() call where $to or $subject derives from user-controlled input
  # that has NOT been through that sanitizer.
  # ---------------------------------------------------------------------------
  - id: ipam-mail-header-injection
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sanitizers:
      - pattern: preg_replace('/[\r\n]/', '', ...)
      - pattern: preg_replace("/[\r\n]/", '', ...)
      - pattern: filter_var(...)
      - pattern: (int)$X
    pattern-sinks:
      - pattern: mail($SINK, ...)
      - pattern: mail($TO, $SINK, ...)
    message: >
      mail() called with user input ($SOURCE) in $to or $subject without sanitizing
      \r and \n characters. Use preg_replace('/[\r\n]/', '', $value) before mail().
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-20
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # Scanner IP injection: proc_open() / socket functions with user-controlled IP
  #
  # All IPs passed to proc_open() (ping) or fsockopen() must be validated
  # through normalize_ip() first. This rule flags any such call where the
  # argument derives directly from $_GET/$_POST/$_REQUEST without validation.
  # ---------------------------------------------------------------------------
  - id: ipam-proc-open-safe
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
    pattern-sanitizers:
      - pattern: normalize_ip(...)
      - pattern: filter_var($X, FILTER_VALIDATE_IP)
      - pattern: (int)$X
      - pattern: intval(...)
    pattern-sinks:
      - pattern: proc_open($SINK, ...)
      - pattern: shell_exec($SINK)
      - pattern: system($SINK, ...)
      - pattern: passthru($SINK, ...)
      - pattern: fsockopen($SINK, ...)
      - pattern: pfsockopen($SINK, ...)
    message: >
      User input ($SOURCE) passed to a process/socket function without IP validation.
      Always call normalize_ip() to validate before passing to proc_open/fsockopen.
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-78
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # Open redirect: header('Location: ...') with unvalidated user input
  # ---------------------------------------------------------------------------
  - id: ipam-open-redirect
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
    pattern-sanitizers:
      - pattern: ltrim($X, '/')
      - pattern: parse_url(...)
      - pattern: "\"...\""
      - pattern: "'...'"
    pattern-sinks:
      - pattern: 'header("Location: " . $SINK)'
      - pattern: "header('Location: ' . $SINK)"
      - pattern: 'header("Location: $SINK")'
    message: >
      header('Location: ...') constructed with user input ($SOURCE) without validation.
      Restrict redirects to known-good paths or validate with parse_url().
    languages: [php]
    severity: WARNING
    metadata:
      category: security
      cwe: CWE-601
      confidence: MEDIUM

  # ---------------------------------------------------------------------------
  # Cross-engine SQL portability (v2.10.0+)
  #
  # v2.10.0 introduced the MysqlDialect alongside SqliteDialect. Every SQLite-
  # specific idiom that slips into page handlers, lib.php, or new migration
  # closures targeting post-v2.9.0 schema will break on MySQL. These rules
  # catch the most common offenders that the v2.9.0 #379/#380 audit missed
  # and that v2.10.0 #384 / #433 had to sweep (28 call sites across 15 files).
  #
  # Exclusions — files where SQLite-specific SQL is correct by design:
  #   - "**/Simple-PHP-IPAM/schema.sql              (SQLite-only schema file)"
  #   - "**/Simple-PHP-IPAM/migrations.php          (historical closures stay"
  #                                              SQLite-specific per the
  #                                              #484 scope decision)
  #   - "**/Simple-PHP-IPAM/dialects/SqliteDialect.php (the dialect itself)"
  #   - Simple-PHP-IPAM/lib.php:ipam_db_dump_stream() (SQLite-format backup
  #                                                    dump, engine-specific
  #                                                    by design)
  #
  # All other files must use the dialect helpers: $dialect->now(),
  # $dialect->autoincrement(), $dialect->upsert_or_ignore(),
  # $dialect->null_safe_eq(), $dialect->pragma_foreign_keys(), etc.
  # ---------------------------------------------------------------------------
  - id: ipam-sqlite-datetime-now
    patterns:
      - pattern: "\"...datetime('now'...\""
      - pattern-not-inside: $DB->exec("...PRAGMA foreign_keys...")
    paths:
      exclude:
        - "**/Simple-PHP-IPAM/schema.sql"
        - "**/Simple-PHP-IPAM/migrations.php"
        - "**/Simple-PHP-IPAM/dialects/SqliteDialect.php"
    message: >
      SQLite-specific `datetime('now')` literal in SQL string.
      Use `" . ipam_dialect()->now() . "` for cross-engine compatibility.
      See v2.10.0 #384 for the full audit history.
    languages: [php]
    severity: ERROR
    metadata:
      category: portability
      confidence: HIGH

  - id: ipam-sqlite-begin-exclusive
    pattern: $DB->exec("BEGIN EXCLUSIVE...")
    paths:
      exclude:
        - "**/Simple-PHP-IPAM/dialects/SqliteDialect.php"
    message: >
      SQLite-specific `BEGIN EXCLUSIVE` transaction mode. MySQL and Postgres
      reject the EXCLUSIVE modifier. Branch on `ipam_dialect()->driver_name()`
      or use plain `START TRANSACTION` / `BEGIN` on non-SQLite engines.
    languages: [php]
    severity: ERROR
    metadata:
      category: portability
      confidence: HIGH

  - id: ipam-sqlite-sequence
    pattern: "\"...sqlite_sequence...\""
    paths:
      exclude:
        - "**/Simple-PHP-IPAM/dialects/SqliteDialect.php"
        - "**/Simple-PHP-IPAM/migrations.php"
    message: >
      `sqlite_sequence` is a SQLite-internal table for AUTOINCREMENT counters.
      MySQL and Postgres have their own mechanisms (ALTER TABLE ...
      AUTO_INCREMENT = 1, ALTER SEQUENCE ... RESTART). Guard the call with
      `if (ipam_dialect()->driver_name() === 'sqlite')`.
    languages: [php]
    severity: ERROR
    metadata:
      category: portability
      confidence: HIGH

  - id: ipam-sqlite-pragma-table-info
    pattern: "\"...PRAGMA table_info...\""
    paths:
      exclude:
        - "**/Simple-PHP-IPAM/dialects/SqliteDialect.php"
        - "**/Simple-PHP-IPAM/migrations.php"
    message: >
      `PRAGMA table_info` is a SQLite introspection query. MySQL uses
      `information_schema.columns` and Postgres uses `information_schema`
      too. Add a dialect helper if this information is needed cross-engine;
      historical migrations in migrations.php are exempt per the #484 scope
      decision (they never execute on MySQL because schema.mysql.sql
      pre-seeds schema_migrations).
    languages: [php]
    severity: ERROR
    metadata:
      category: portability
      confidence: HIGH

  - id: ipam-sqlite-insert-or-ignore
    pattern: "\"...INSERT OR IGNORE INTO $TABLE...\""
    paths:
      exclude:
        - "**/Simple-PHP-IPAM/dialects/SqliteDialect.php"
        - "**/Simple-PHP-IPAM/migrations.php"
    message: >
      `INSERT OR IGNORE` is SQLite-specific. Use
      `Dialect::upsert_or_ignore($table, $conflictCols)` which emits the
      right form per engine (SQLite: `ON CONFLICT(...) DO NOTHING`,
      MySQL: `ON DUPLICATE KEY UPDATE col = col`, Postgres: `ON CONFLICT
      (...) DO NOTHING`).
    languages: [php]
    severity: ERROR
    metadata:
      category: portability
      confidence: HIGH

  - id: ipam-sqlite-strftime
    pattern: "\"...strftime('%...'...\""
    paths:
      exclude:
        - "**/Simple-PHP-IPAM/dialects/SqliteDialect.php"
        - "**/Simple-PHP-IPAM/migrations.php"
    message: >
      `strftime()` is a SQLite function. Use `SUBSTR(col, 1, N)` for simple
      date-to-minute/hour/day truncation — it works on both SQLite (TEXT)
      and MySQL (DATETIME auto-converted to string in string-function
      context) and returns the same prefix.
    languages: [php]
    severity: ERROR
    metadata:
      category: portability
      confidence: HIGH

  - id: ipam-sqlite-datetime-offset
    pattern-regex: "datetime\\('now',\\s*'[-+]"
    paths:
      exclude:
        - "**/Simple-PHP-IPAM/dialects/SqliteDialect.php"
        - "**/Simple-PHP-IPAM/migrations.php"
    message: >
      `datetime('now', '-N days')` modifier arithmetic is SQLite-specific.
      Compute the absolute timestamp in PHP via strtotime + gmdate, then
      bind as a plain string parameter. See dashboard.php and
      api_scan_results() in api.php for examples.
    languages: [php]
    severity: ERROR
    metadata:
      category: portability
      confidence: HIGH

  - id: ipam-sqlite-is-param
    pattern-regex: "\\bIS\\s+:[a-zA-Z_][a-zA-Z0-9_]*"
    paths:
      exclude:
        - "**/Simple-PHP-IPAM/dialects/SqliteDialect.php"
        - "**/Simple-PHP-IPAM/dialects/Dialect.php"
        - "**/Simple-PHP-IPAM/migrations.php"
    message: >
      `IS :param` is SQLite's null-safe equality syntax. MySQL parses
      `IS` as `IS NULL`/`IS NOT NULL` only and rejects a parameter after
      it. Use `Dialect::null_safe_eq($column, $placeholder)` which emits
      the engine-appropriate form (SQLite: `col IS :ph`, MySQL:
      `col <=> :ph`, Postgres: `col IS NOT DISTINCT FROM :ph`).
    languages: [php]
    severity: ERROR
    metadata:
      category: portability
      confidence: HIGH

  - id: ipam-sqlite-unquoted-settings-key
    pattern-regex: "(?:FROM|INTO|UPDATE)\\s+settings\\b[^`\\n]*?\\bkey\\b"
    paths:
      exclude:
        - "**/Simple-PHP-IPAM/dialects/SqliteDialect.php"
    message: >
      `settings.key` must be backtick-quoted in every query — `key` is
      a reserved word in MySQL. SQLite accepts backticks as an identifier
      delimiter so the same SQL runs on both engines. Unquoted usage
      inside a try/catch can silently swallow the error on MySQL and
      hide the deprecation-banner UI (see v2.10.0 #433 post-mortem).
    languages: [php]
    severity: ERROR
    metadata:
      category: portability
      confidence: HIGH

  - id: ipam-sqlite-like-escape-backslash
    pattern-regex: "LIKE [^\"\\n]*ESCAPE '\\\\\\\\'"
    paths:
      exclude:
        - "**/Simple-PHP-IPAM/dialects/SqliteDialect.php"
        - "**/Simple-PHP-IPAM/migrations.php"
    message: >
      `LIKE ... ESCAPE '\\'` renders as `ESCAPE '\'` in SQL text which
      MySQL parses as an unterminated string literal. Use `ESCAPE '!'`
      (neither engine treats `!` specially) and update like_escape() to
      match. See the 5 call sites fixed in v2.10.0 #384.
    languages: [php]
    severity: ERROR
    metadata:
      category: portability
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # CSP: inline <script> blocks in PHP output
  #
  # script-src 'self' blocks all inline scripts. Any PHP file that outputs
  # a <script> tag without a src= attribute is writing an inline script that
  # will be blocked by CSP and silently do nothing in the browser. JS belongs
  # in assets/app.js with a <script src="..."> tag.
  #
  # Pattern covers:
  #   <script>alert(1)</script>       inline JS code
  #   <script type="text/template">  template inline content
  #   <script type="text/html">      HTML-as-string inline content
  #
  # Excluded:
  #   <script src="...">              external script (CSP allows)
  #   <script type="application/json"> JSON data block (CSP allows)
  #
  # Known violations are suppressed with `// nosemgrep: ipam-inline-script-csp`
  # plus a reference to the tracking issue.
  # ---------------------------------------------------------------------------
  - id: ipam-inline-script-csp
    patterns:
      - pattern-regex: '<script\s*>'
      - pattern-not-regex: 'src=|nosemgrep'
    paths:
      include:
        - "**/Simple-PHP-IPAM/*.php"
        - "**/Simple-PHP-IPAM/views/*.php"
    message: >
      Inline <script> block will be blocked by Content-Security-Policy: script-src 'self'.
      Move the JS to Simple-PHP-IPAM/assets/app.js and load it with <script src="..." integrity="..."></script>.
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-693
      confidence: HIGH
